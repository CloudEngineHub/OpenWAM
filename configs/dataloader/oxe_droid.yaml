type: oxe_droid

# Single LeRobot v3 dataset with meta/eef_stats.json and resolved tasks.parquet.
# Wrist/mount poses and inverted closedness retain the canonical DROID EEF contract.
dataset_dir: /mnt/data/wangyuran/pretrain_data_final/Droid

# Windows preserve episode boundaries and align video with action/state samples.
num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
split: train

# Stored normalization statistics are read from the dataset's meta directory.
normalize_mode: quantile
enable_action_supervision: true
unify_action: true
unify_action_map: ["0-9", "34-43"]

# One consistent augmentation per training clip.
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

# Optional reproducible footage budget; null loads the complete dataset.
total_hours: null
