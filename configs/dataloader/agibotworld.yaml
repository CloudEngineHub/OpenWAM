type: agibotworld

# Family root with native LeRobot v3 buckets and meta/stats_g2a.json.
# The reader retains separate action/state statistics and native hand/mobile masks.
dataset_dir: /mnt/data/wangyuran/pretrain_data_final/AgiBotWorld-Beta

# Windows preserve episode boundaries and align video with action/state samples.
num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
split: train

# Stored normalization statistics are read from the dataset's meta directory.
normalize_mode: quantile
enable_action_supervision: true
unify_action: true

# One consistent augmentation per training clip.
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

# Optional reproducible footage budget; null loads the complete dataset.
total_hours: null
